name: Release Artifacts, SHA256SUMS & SLSA Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Package release archive & SHA256SUMS
        run: |
          mkdir -p release_assets
          cp dist/Donahue_2026_alife_singularity_omega.pdf release_assets/
          cp dist/arxiv_submission.tar.gz release_assets/
          cp CHECKSUMS.sha256 release_assets/
          cp results/lean_package_axioms.txt release_assets/
          zip -r release_assets/ALife_Singularity_SuperLife_Omega_Package.zip \
            README.md VERSION LICENSE LICENSE-CODE CITATION.cff csv specs excel reports html pdf pipelines results lean palomar paper blueprint reference
          (cd release_assets && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release_assets/*"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "release_assets/*"
