name: GitHub Pages (Observatory, Lean Blueprint & White Paper)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site (_site/)
        run: |
          mkdir -p _site/blueprint _site/dist _site/html _site/docs/media
          cp html/ALife_Singularity_SuperLife_Omega_Dashboard.html _site/index.html
          cp html/*.html _site/html/
          cp blueprint/index.html _site/blueprint/index.html
          cp dist/Donahue_2026_alife_singularity_omega.pdf _site/dist/
          cp docs/media/social-preview.png _site/docs/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
