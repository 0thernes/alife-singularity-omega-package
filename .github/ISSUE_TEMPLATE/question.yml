name: Question
description: Ask how the Lean proofs, simulator, OVBS-52 suite, or build pipeline work.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: checkboxes
    id: faq
    attributes:
      label: Checks
      options:
        - label: I checked docs/faq.md, docs/glossary.md, and README.md.
          required: true
