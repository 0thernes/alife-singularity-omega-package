version: "v0.4"
release_version: "3.4.0"

project:
  name: "ALife Singularity Omega Package Formal Invariant Suite (OmegaPackageProofs)"
  description: >-
    Zero-Mathlib, strictly constructive Lean 4.35.0 model of the package's integer
    scoring and access-control rules: 36 core declarations (plus 4 Palomar comparator
    wrappers = 40 printed audit lines). 15 are quantified statements: OVBS-52 bound and
    monotonicity facts, the anti-gaming gate, a monotone 7-stage classifier, 13x13
    synergy cap bounds/symmetry/monotonicity, a threshold gate rejecting natural-number
    inputs above 9900, and Pareto irreflexivity and transitivity. 21 are closed
    evaluations, literal sums or NonVacuity witnesses; the cube, 825-check, 78-alert,
    748-run, 291 and 327 items check arithmetic on reported counts and certify no data.
    The Ring-0 write predicate returns false by definition, and the Ring-0 state theorem
    holds because the modelled write function returns its input for every ring; it is
    not a non-interference result. The 291 companion-repository theorems are not built
    or checked here.
  authors:
    - name: "Alexander Stephen Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
  license: "Apache-2.0"

