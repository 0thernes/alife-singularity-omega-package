sources:
  - title: "A-Life Singularity, Super A-Life, and Clean-Slate v3.0 (v3.4-Omega): Hardware Ring-0 Constitutional Invariants, 748-Run Paired Falsification, and 327 Pure 6-Kernel Lean 4.35.0 Theorems"
    authors:
      - "Alexander Stephen Donahue"
    id: "https://github.com/0thernes/alife-singularity-omega-package"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original formal invariant suite accompanying alife-singularity-omega-package v3.4.0.
      No external DOI, arXiv ID, or peer review is claimed prior to confirmed assignment.

status:
  scope: >-
    Checks discrete integer/basis-point scoring bounds and monotonicity, the anti-gaming
    gate, stage monotonicity, synergy cap bounds, a definitional Ring-0 write predicate,
    Pareto order properties, literal-sum identities for reported counts, and concrete
    NonVacuity witnesses, with zero Mathlib; the 40 audited declarations use only
    propext and Quot.sound. No hardware is modelled.
    Explicitly NOT formalized in this package suite: continuous IEEE-754 Kahan-Neumaier
    simulations (verified empirically + via 50-digit Decimal oracle) or any of the 1,900
    overarching open problems in unsolved-problems-mega-atlas (0/1,900 retired).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
  main_results:
    - declaration: "OmegaPackageProofs.Palomar.m1_ovbs52_scoring_invariants"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "lean/comparator.json"
    - declaration: "OmegaPackageProofs.Palomar.m2_cube_and_partition_invariants"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "lean/comparator.json"
    - declaration: "OmegaPackageProofs.Palomar.m3_castration_and_ring0_invariants"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "lean/comparator.json"
    - declaration: "OmegaPackageProofs.Palomar.m4_nonvacuity_certificate"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "lean/comparator.json"

automation:
  methods:
    - method: "manual"
      notes: "Alexander Stephen Donahue conceived the unified ALife Singularity architecture, formal invariant scope, Ring-0 constitutional framing, and multi-cycle hardening discipline, and bears sole responsibility for the work."
    - method: "agent"
      models:
        - "Gemini (Antigravity)"
      framework: "Antigravity"
      notes: >-
        Assisted with Lean 4.35.0 proof engineering, NonVacuity witness construction,
        Python verification/oracle/mutation suites, and AMS-LaTeX white-paper production
        under human direction and audit.

fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact integer centi-point OVBS-52 formulas, a Ring-0 write
    predicate and a state-update function that returns its input for every ring; IEEE-754 float64 scoring and Kahan-Neumaier 11-pool energy
    conservation (max drift 2.463e-16 across 748 live runs) are verified differentially
    against reference/ovbs52_oracle.py (50-digit Decimal/Fraction) and empirical runtime gates.
    See docs/statement-fidelity.md for the complete row-by-row correspondence matrix.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Machine-checked locally with Lean 4.35.0, leanchecker,
    and multi-kernel CI replay with 0 warnings, 0 sorry outside the 4 challenge stubs in
    lean/palomar/PalomarChallenge.lean, and 0 native_decide.
