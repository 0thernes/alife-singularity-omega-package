project:
  name: "ALife Singularity Omega Package Formal Invariant Suite (OmegaPackageProofs)"
  description: >-
    Zero-Mathlib, strictly constructive Lean 4.35.0 formalization of the package's
    integer scoring, non-degenerate 3-Ring ACL state machine, synergy bounds, and
    adversarial definition refutations: 50 core declarations plus 5 Palomar comparator
    certificates (= 55 printed #print axioms audit lines). 29 are quantified, inductive,
    reachability, or formal negation theorems (OVBS-52 bounds, monotonicity, Lipschitz
    sensitivity, anti-gaming & zero-Spiegelman annihilation, monotone 7-stage classifier,
    13x13 synergy bounds/symmetry/monotonicity, multi-step inductive Ring-0 kernel trace
    invariance over a 3-ring state machine where Ring-1 and Ring-2 genuinely mutate,
    spectral-norm rejection above 9900 bps, Pareto irreflexivity/transitivity, and 10
    formal AdversarialTests refutations). 21 are closed arithmetic accounting locks or
    concrete NonVacuity witnesses (cube, 75 substrates, 825 checks, 78 alerts, 748 runs,
    310 native + 50 local = 360 Lean totals); those arithmetic locks check exact count
    consistency and certify no empirical or companion-repo data. The 310 companion-engine
    theorems are verified in their respective repositories and audited via receipts.
  authors:
    - name: "Alexander Stephen Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
  license: "Apache-2.0"

