[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alife-singularity-omega-package"
version = "3.5.0"
description = "A-Life Singularity x Clean-Slate v3.0 Omega Package: Software 3-Ring ACL invariants, 748-run paired falsification, 55 local constructive Lean 4.35.0 declarations, and 1,900-problem Mega-Atlas non-retirement audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alexander Stephen Donahue", email = "0_0@0thernes.art" },
]
keywords = ["artificial-life", "open-ended-evolution", "lean4", "formal-verification", "ring-0", "ovbs-52"]
dependencies = [
  "jsonschema>=4.23.0",
  "matplotlib>=3.9.0",
  "numpy>=2.0.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.0.0",
  "PyYAML>=6.0.2",
  "scipy>=1.14.0",
  "xlrd>=2.0.1",
  "xlwt>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112.0",
  "mypy>=1.13.0",
  "pytest>=9.0.3",
  "ruff>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/0thernes/alife-singularity-omega-package"
Repository = "https://github.com/0thernes/alife-singularity-omega-package"
Issues = "https://github.com/0thernes/alife-singularity-omega-package/issues"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["lean/.lake", "paper/build", ".v3_source_baseline"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "E402", "E701", "E702", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["reference"]
